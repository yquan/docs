<style>
  .highlight,
  figure.highlight,
  .highlighter-rouge,
  pre.highlight,
  pre.code-block-copy {
    position: relative;
  }

  .copy-code-button {
    position: absolute;
    top: 0.4rem;
    right: 0.4rem;
    z-index: 1;
    padding: 0.2rem 0.55rem;
    font-size: 0.75rem;
    line-height: 1.4;
    border: 1px solid rgba(128, 128, 128, 0.45);
    border-radius: 0.25rem;
    background: rgba(255, 255, 255, 0.92);
    color: inherit;
    cursor: pointer;
    opacity: 0.85;
  }

  .copy-code-button:hover {
    opacity: 1;
  }

  .copy-code-button--success {
    border-color: #2da44e;
    color: #1a7f37;
  }

  @media (prefers-color-scheme: dark) {
    .copy-code-button {
      background: rgba(30, 30, 30, 0.92);
      border-color: rgba(200, 200, 200, 0.35);
    }
  }
</style>
<script>
(function () {
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text);
    }
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    return Promise.resolve();
  }

  function codeBlockHost(pre) {
    return (
      pre.closest(".highlighter-rouge, figure.highlight, div.highlight") || pre
    );
  }

  function attachCopyButton(pre) {
    if (!pre || pre.closest("pre") !== pre) return;

    var host = codeBlockHost(pre);
    if (host.getAttribute("data-copy-attached") === "true") return;
    host.setAttribute("data-copy-attached", "true");

    if (getComputedStyle(host).position === "static") {
      host.style.position = "relative";
    }
    if (host === pre) {
      pre.classList.add("code-block-copy");
    }

    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "copy-code-button";
    btn.textContent = "Copy";
    btn.setAttribute("aria-label", "Copy code to clipboard");
    host.appendChild(btn);

    btn.addEventListener("click", function () {
      var code = pre.querySelector("code");
      var text = (code || pre).innerText.replace(/\n$/, "");
      copyText(text).then(
        function () {
          btn.textContent = "Copied!";
          btn.classList.add("copy-code-button--success");
          setTimeout(function () {
            btn.textContent = "Copy";
            btn.classList.remove("copy-code-button--success");
          }, 2000);
        },
        function () {
          btn.textContent = "Failed";
          setTimeout(function () {
            btn.textContent = "Copy";
          }, 2000);
        }
      );
    });
  }

  document.querySelectorAll("pre").forEach(attachCopyButton);
})();
</script>
